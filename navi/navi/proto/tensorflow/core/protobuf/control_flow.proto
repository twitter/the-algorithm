syntatwitter = "proto3";

package tensorflow;

option cc_enable_arenas = true;
option java_outer_classname = "ControlFlowProtos";
option java_multiple_files = true;
option java_package = "org.tensorflow.framework";
option go_package = "github.com/tensorflow/tensorflow/tensorflow/go/core/protobuf/for_core_protos_go_proto";

// Control flow contetwittert related protocol buffers.

// Protocol buffer representing the values in ControlFlowContetwittert.
message ValuesDef {
  // Value names that have been seen in this contetwittert.
  repeated string values = 1;

  // Value names referenced by but etwitterternal to this contetwittert.
  map<string, string> etwitterternal_values = 2;
}

// Container for any kind of control flow contetwittert. Any other control flow
// contetwitterts that are added below should also be added here.
message ControlFlowContetwittertDef {
  oneof cttwittert {
    CondContetwittertDef cond_cttwittert = 1;
    WhileContetwittertDef while_cttwittert = 2;
  }
}

// Protocol buffer representing a CondContetwittert object.
message CondContetwittertDef {
  // Name of the contetwittert.
  string contetwittert_name = 1;

  // Name of the pred tensor.
  string pred_name = 2;

  // Name of the pivot tensor.
  string pivot_name = 3;

  // Branch prediction. 0 or 1.
  int32 branch = 4;

  // Values and etwitterternal values in control flow contetwittert.
  ValuesDef values_def = 5;

  // Contetwitterts contained inside this contetwittert (e.g. nested conds).
  repeated ControlFlowContetwittertDef nested_contetwitterts = 6;
}

// Protocol buffer representing a WhileContetwittert object.
message WhileContetwittertDef {
  // Name of the contetwittert.
  string contetwittert_name = 1;

  // The number of iterations allowed to run in parallel.
  int32 parallel_iterations = 2;

  // Whether backprop is enabled for this while loop.
  bool back_prop = 3;

  // Whether GPU-CPU memory swap is enabled for this loop.
  bool swap_memory = 4;

  // Name of the pivot tensor.
  string pivot_name = 5;

  // Name of the pivot_for_pred tensor.
  string pivot_for_pred_name = 6;

  // Name of the pivot_for_body tensor.
  string pivot_for_body_name = 7;

  // List of names for etwitterit tensors.
  repeated string loop_etwitterit_names = 8;

  // List of names for enter tensors.
  repeated string loop_enter_names = 10;

  // Values and etwitterternal values in control flow contetwittert.
  ValuesDef values_def = 9;

  // Optional name of the matwitterimum_iterations tensor.
  string matwitterimum_iterations_name = 11;

  // Contetwitterts contained inside this contetwittert (e.g. nested whiles).
  repeated ControlFlowContetwittertDef nested_contetwitterts = 12;

  // Netwittert available id: 13.
}
