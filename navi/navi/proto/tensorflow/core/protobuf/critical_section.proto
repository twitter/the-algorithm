syntatwitter = "proto3";

package tensorflow;

option cc_enable_arenas = true;
option java_outer_classname = "CriticalSectionProtos";
option java_multiple_files = true;
option java_package = "org.tensorflow.framework";
option go_package = "github.com/tensorflow/tensorflow/tensorflow/go/core/protobuf/for_core_protos_go_proto";

// Protocol buffer representing a CriticalSection.
message CriticalSectionDef {
  // Name of the critical section handle.
  string critical_section_name = 1;
}

// Protocol buffer representing a CriticalSection etwitterecution.
message CriticalSectionEtwitterecutionDef {
  // Name of the critical section handle.
  string etwitterecute_in_critical_section_name = 1;
  // Whether this operation requires etwitterclusive access to its resources,
  // (i.e., no other CriticalSections may request the same resources).
  bool etwitterclusive_resource_access = 2;
}
