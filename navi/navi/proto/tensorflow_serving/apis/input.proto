// Input used in serving APIs.  Based on the tensorflow.Etwitterample family of
// feature representations.

syntatwitter = "proto3";

option cc_enable_arenas = true;

import "tensorflow/core/etwitterample/etwitterample.proto";

package tensorflow.serving;

// Specifies one or more fully independent input Etwitteramples.
// See etwitteramples at:
//     https://github.com/tensorflow/tensorflow/blob/master/tensorflow/core/etwitterample/etwitterample.proto
message EtwitterampleList {
  repeated tensorflow.Etwitterample etwitteramples = 1;
}

// Specifies one or more independent input Etwitteramples, with a common contetwittert
// Etwitterample.
//
// The common use case for contetwittert is to cleanly and optimally specify some
// features that are common across multiple etwitteramples.
//
// See etwitterample below with a search query as the contetwittert and multiple restaurants
// to perform some inference on.
//
// contetwittert: {
//   features: {
//     feature: {
//       key  : "query"
//       value: {
//         bytes_list: {
//           value: [ "pizza" ]
//         }
//       }
//     }
//   }
// }
// etwitteramples: {
//   features: {
//     feature: {
//       key  : "cuisine"
//       value: {
//         bytes_list: {
//           value: [ "Pizzeria" ]
//         }
//       }
//     }
//   }
// }
// etwitteramples: {
//   features: {
//     feature: {
//       key  : "cuisine"
//       value: {
//         bytes_list: {
//           value: [ "Taqueria" ]
//         }
//       }
//     }
//   }
// }
//
// Implementations of EtwitterampleListWithContetwittert merge the contetwittert Etwitterample into each
// of the Etwitteramples. Note that feature keys must not be duplicated between the
// Etwitteramples and contetwittert Etwitterample, or the behavior is undefined.
//
// See also:
//     tensorflow/core/etwitterample/etwitterample.proto
//     https://developers.google.com/protocol-buffers/docs/proto3#maps
message EtwitterampleListWithContetwittert {
  repeated tensorflow.Etwitterample etwitteramples = 1;
  tensorflow.Etwitterample contetwittert = 2;
}

message Input {
  oneof kind {
    EtwitterampleList etwitterample_list = 1 [lazy = true];
    EtwitterampleListWithContetwittert etwitterample_list_with_contetwittert = 2 [lazy = true];
  }
}
