# Deciders related to reverse-chron home timeline materialization.
multiplier_of_materialization_tweets_fetched:
  comment: "Multiplier applied to the number of tweets fetched from search etwitterpressed as percentage. 100 means 100%. It can be used to fetch more than the number tweets requested by a caller (to improve similarity) or to fetch less than requested to reduce load."
  default_availability: 100
enable_backfill_filtered_entries:
  comment: "Controls whether to back-fill timeline entries that get filtered out by TweetsPostFilter during home timeline materialization."
  default_availability: 0
tweets_filtering_lossage_threshold:
  comment: "If back-filling filtered entries is enabled and if percentage of tweets that get filtered out etwitterceeds this value then we will issue a second call to get more tweets. Default value 2000 == 20%"
  default_availability: 2000
tweets_filtering_lossage_limit:
  comment: "We need to ensure that the number of tweets requested by the second call are not unbounded (for etwitterample, if everything is filtered out in the first call) therefore we limit the actual filtered out percentage to be no greater than the value below. Default value 6000 == 60%. That is, even if the actual lossage is 90% we will consider it to be only 60% for the purpose of back-filling."
  default_availability: 6000
supplement_follows_with_real_graph:
  comment: "Whether to fetch additional follows from RealGraph for users with more than the matwitter follows fetched from SGS during home timeline materialization."
  default_availability: 0

# Deciders related to recap.
recap_enable_content_features_hydration:
  comment: "If true, semantic core, penguin, and tweetypie based etwitterpensive features will be hydrated for recap Tweets. Otherwise those features are not set"
  default_availability: 10000
recap_matwitter_count_multiplier:
  comment: "We multiply matwitterCount (caller supplied value) by this multiplier and fetch those many candidates from search so that we are left with sufficient number of candidates after hydration and filtering. 100 == 1.0"
  default_availability: 100
recap_enable_etwittertra_sorting_in_results:
  comment: "If TLR will do etwittertra sorting in search results"
  default_availability: 10000

# Deciders related to recycled tweets.
recycled_enable_content_features_hydration:
  comment: "If true, semantic core, penguin, and tweetypie based etwitterpensive features will be hydrated for recycled Tweets. Otherwise those features are not set"
  default_availability: 0
recycled_matwitter_count_multiplier:
  comment: "We multiply matwitterCount (caller supplied value) by this multiplier and fetch those many candidates from search so that we are left with sufficient number of candidates after hydration and filtering. 100 == 1.0"
  default_availability: 100

# Deciders related to entity tweets.
entity_tweets_enable_content_features_hydration:
  comment: "If true, semantic core, penguin, and tweetypie based etwitterpensive features will be hydrated for entity Tweets. Otherwise those features are not set"
  default_availability: 10000

# Deciders related to both recap and recycled tweets
enable_real_graph_users:
  comment: "This is used only if user follows >= 1000. If true, etwitterpands user seedset with real graph users and recent followed users. Otherwise, user seedset only includes followed users."
  default_availability: 0
matwitter_real_graph_and_followed_users:
  comment: "Matwitterimum number of combined real graph users and recent followed users in the user seedset for recap and recycled tweets if enable_real_graph_users is true and only_real_graph_users is false. This is upper bounded by 2000."
  default_availability: 1000

# Deciders related to recap author
recap_author_enable_new_pipeline:
  comment: "Enable new recap author pipeline"
  default_availability: 0
recap_author_enable_content_features_hydration:
  comment: "If true, semantic core, penguin, and tweetypie based etwitterpensive features will be hydrated for PYLE Tweets. Otherwise those features are not set"
  default_availability: 0

# Deciders related to recap hydration(rectweet+ranked organic).
recap_hydration_enable_content_features_hydration:
  comment: "If true, semantic core, penguin, and tweetypie based etwitterpensive features will be hydrated for rectweet+ranked organic Tweets. Otherwise those features are not set"
  default_availability: 0

# Deciders related to uteg liked by tweets
