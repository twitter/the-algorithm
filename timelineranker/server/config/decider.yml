# Deciders that can be used to control load on TLR or its backends.
enable_matwitter_concurrency_limiting:
  comment: "When enabled, limit matwitterConcurrency filter. Note: Requires system property matwitterConcurrency to be set."
  default_availability: 0

# Deciders related to testing / debugging.
enable_routing_to_ranker_dev_protwittery:
  comment: "Route dark traffic to the TimelineRanker development protwittery. 100% means ~100% of requests to a host."
  default_availability: 0

