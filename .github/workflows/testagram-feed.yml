name: testagram-feed
on:
  push:
    branches: [main, "feat/**"]
    paths: ["testagram-feed/**", ".github/workflows/testagram-feed.yml"]
  pull_request:
    paths: ["testagram-feed/**", ".github/workflows/testagram-feed.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: testagram-feed/go.mod
      - name: Format Go source
        working-directory: testagram-feed
        run: |
          files=$(gofmt -l $(find cmd internal -name '*.go' -type f))
          if [ -n "$files" ]; then echo "Go files need formatting:"; echo "$files"; exit 1; fi
      - name: Test
        working-directory: testagram-feed
        run: go test -race -count=1 -cover ./...
      - name: Static analysis
        working-directory: testagram-feed
        run: go vet ./...
      - name: Build
        working-directory: testagram-feed
        run: go build ./cmd/feed-api
